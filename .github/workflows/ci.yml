name: CI Pipeline

on:
  push:
    branches: [ "main", "features/tasks-api" ]
  pull_request:
    branches: [ "main", "features/tasks-api" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, pdo_sqlite, bcmath, curl, dom, fileinfo, xml, tokenizer
        tools: composer:2.8.12

    - name: Instalar dependencias de Composer
      run: composer install --prefer-dist --no-progress --no-suggest --optimize-autoloader

    - name: Configurar variables de entorno y SQLite para pruebas
      run: |
        cp .env.example .env || echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" > .env
        sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=:memory:/' .env
        php artisan config:clear

    - name: Ejecutar migraciones y pruebas automatizadas
      run: |
        php artisan migrate --force
        php artisan test